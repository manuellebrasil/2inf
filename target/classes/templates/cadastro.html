<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME</title>
</head>
<body>
<h1>Cadastro de Turma</h1>

<form th:action="@{/turma/salvar}" th:object="${turma}" method="post">
    <label>Código:</label>
    <input type="text" th:field="*{codigo}">
    <label>Descrição:</label>
    <input type="text" th:field="*{descricao}">
    <input type="submit" value="salvar">
</form>



<table border="1">

    <tr>
        <th>Código</th>
        <th>Descrição</th>
    </tr>

    <tr th:each="turma : ${listaTurma}">
        <td th:text="${turma.codigo}"></td>
        <td th:text="${turma.descricao}"></td>
    </tr>

</table>
</body>
</html>
