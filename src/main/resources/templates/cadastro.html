<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME</title>
</head>
<body>
<h1>Cadastro de Turma</h1>
<table border="1">

    <tr>
        <th>Código</th>
        <th>Descrição</th>
    </tr>

    <tr th:each="turma" : ${listaTurma}="" }">
        <td th:text="${turma.código}"></td>
        <td th:text="${turma.descrição}"></td>

    </tr>

</table>
</body>
</html>
